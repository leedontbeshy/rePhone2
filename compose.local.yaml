# Standalone, self-contained development stack. Does not read .env/.env.docker credentials.
name: rephone-local

x-api-build: &api-build
  context: .
  dockerfile: infra/docker/api.Dockerfile
  target: api-local

x-api-environment: &api-environment
  API_PORT: '4001'
  API_PUBLIC_URL: http://localhost:${LOCAL_API_PORT:-4001}
  WEB_PUBLIC_URL: http://localhost:${LOCAL_WEB_PORT:-3001}
  WEB_ORIGIN: http://localhost:${LOCAL_WEB_PORT:-3001}
  SUPABASE_URL: http://localhost:${LOCAL_API_PORT:-4001}

x-common: &common
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    options:
      max-size: 10m
      max-file: '3'

services:
  postgres-test:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: rephone_test
      POSTGRES_USER: rephone
      POSTGRES_PASSWORD: rephone
      TZ: UTC
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U rephone -d rephone_test']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  init:
    image: rephone-local-api:dev
    build: *api-build
    env_file: ./infra/docker/local-test.env
    environment: *api-environment
    depends_on:
      postgres-test: { condition: service_healthy }
    command:
      - sh
      - -ec
      - pnpm --filter @rephone/api db:deploy && pnpm --filter @rephone/api exec tsx prisma/scripts/affiliate-test-seed.ts
    restart: 'no'
    <<: *common

  api:
    image: rephone-local-api:dev
    build: *api-build
    env_file: ./infra/docker/local-test.env
    environment: *api-environment
    ports:
      - '127.0.0.1:${LOCAL_API_PORT:-4001}:4001'
    volumes:
      - uploads:/workspace/.local/affiliate/storage
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./apps/api
          ignore: [node_modules/, dist/, src/generated/]
        - action: rebuild
          path: ./scripts
        - action: rebuild
          path: ./packages
          ignore: ['**/node_modules/', '**/dist/']
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./package.json
    <<: *common

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: web-development
    environment:
      NODE_ENV: development
      REPHONE_SANDBOX_WEB: 'true'
      REPHONE_AFFILIATE_TEST: 'true'
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${LOCAL_API_PORT:-4001}/api/v1
      API_INTERNAL_BASE_URL: http://api:4001/api/v1
      API_PUBLIC_URL: http://localhost:${LOCAL_API_PORT:-4001}
      DEALER_ENVIRONMENT: TEST
      DEALER_SANDBOX_WEB_URL: http://localhost:${LOCAL_WEB_PORT:-3001}
      DEALER_SANDBOX_API_URL: http://localhost:${LOCAL_API_PORT:-4001}/api/v1
    command: [pnpm, --filter, '@rephone/web', exec, next, dev, -H, 0.0.0.0, -p, '3001']
    ports:
      - '127.0.0.1:${LOCAL_WEB_PORT:-3001}:3001'
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(r.status!==204)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /workspace/apps/web
          ignore:
            [
              node_modules/,
              .next/,
              .next-affiliate-test/,
              .next-dealer-sandbox/,
              package.json,
              '*.tsbuildinfo',
            ]
        - action: rebuild
          path: ./packages
          ignore: ['**/node_modules/', '**/dist/']
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./package.json
    <<: *common

volumes:
  database:
  uploads:
