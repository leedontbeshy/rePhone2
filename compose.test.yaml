x-test-environment: &test-environment
  NODE_ENV: test
  API_PORT: '4001'
  API_PUBLIC_URL: http://api-test:4001
  WEB_PUBLIC_URL: http://web-test:3001
  WEB_ORIGIN: http://web-test:3001
  DATABASE_URL: postgresql://rephone:rephone@postgres-test:5432/rephone_test
  DIRECT_URL: postgresql://rephone:rephone@postgres-test:5432/rephone_test
  TEST_DATABASE_URL: postgresql://rephone:rephone@postgres-test:5432/rephone_test
  DB_POOL_MAX: '5'
  DB_CONNECTION_TIMEOUT_MS: '5000'
  DB_IDLE_TIMEOUT_MS: '10000'
  JWT_ACCESS_SECRET: test-only-jwt-secret-with-at-least-thirty-two-bytes
  IDENTIFIER_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  IDENTIFIER_HMAC_KEY: YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODk=
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: test-placeholder-service-role-key
  SUPABASE_PUBLIC_BUCKET: rephone-public-test
  SUPABASE_PRIVATE_BUCKET: rephone-private-test
  SUPABASE_STORE_BUCKET: rephone-store-assets-test
  SMTP_HOST: mail-test
  SMTP_PORT: '1025'
  SMTP_SECURE: 'false'
  SMTP_REQUIRE_TLS: 'false'
  MAIL_FROM: rePhone Test <no-reply@rephone.local>
  LOG_LEVEL: silent
  SCHEDULER_ENABLED: 'false'
  TRUST_PROXY: 'false'
  APP_VERSION: test

services:
  api-test:
    image: rephone-api-test:${APP_VERSION:-test}
    profiles: [test]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: api-operations
    environment: *test-environment
    depends_on:
      postgres-test:
        condition: service_healthy
    command:
      - sh
      - -ec
      - >-
        pnpm --filter @rephone/api test:db:prepare &&
        pnpm --filter @rephone/api test &&
        pnpm --filter @rephone/api test:integration &&
        pnpm --filter @rephone/api test:e2e
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: 'no'
    networks: [backend]
    logging:
      options:
        max-size: 10m
        max-file: '3'
