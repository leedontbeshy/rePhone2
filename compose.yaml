name: rephone

services:
  postgres-test:
    image: postgres:17.6-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: rephone_test
      POSTGRES_USER: rephone
      POSTGRES_PASSWORD: rephone
      TZ: UTC
    ports:
      - target: 5432
        published: '${POSTGRES_TEST_HOST_PORT:-5433}'
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - rephone_pgtestdata17:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U rephone -d rephone_test']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s
    # Docker Desktop cannot publish a port from a container attached only to an
    # internal network. The second bridge is used solely for host test access.
    networks: [backend, egress]
    logging:
      options:
        max-size: 10m
        max-file: '3'

networks:
  frontend:
  backend:
    internal: true
  egress:

volumes:
  rephone_pgtestdata17:
  caddy_data:
  caddy_config:
