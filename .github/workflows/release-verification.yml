name: Release verification
'on':
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_OPTIONS: --max-old-space-size=4096
  NODE_ENV: test
  TURBO_TELEMETRY_DISABLED: '1'
  API_PORT: '4001'
  API_PUBLIC_URL: http://localhost:4001
  WEB_PUBLIC_URL: http://localhost:3001
  WEB_ORIGIN: http://localhost:3001
  JWT_ACCESS_SECRET: test-only-jwt-secret-with-at-least-thirty-two-bytes
  IDENTIFIER_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  IDENTIFIER_HMAC_KEY: YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODk=
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: test-placeholder-service-role-key
  SUPABASE_PUBLIC_BUCKET: rephone-public-test
  SUPABASE_PRIVATE_BUCKET: rephone-private-test
  SUPABASE_STORE_BUCKET: rephone-store-assets-test
  SMTP_HOST: localhost
  SMTP_PORT: '1025'
  SMTP_SECURE: 'false'
  SMTP_REQUIRE_TLS: 'false'
  MAIL_FROM: rePhone Test <no-reply@rephone.local>
  LOG_LEVEL: silent
  SCHEDULER_ENABLED: 'false'
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4001/api/v1
  API_INTERNAL_BASE_URL: http://localhost:4001/api/v1
  REPHONE_SKIP_ENV_FILE: 'true'
jobs:
  production-images:
    name: Production images and isolated smoke
    if:
      github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'full-ci')
      && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Build and probe production images
        run: node scripts/infra/production-smoke.mjs
    concurrency:
      group: release-production-images-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
  fast-gates:
    name: Fast gates (${{ matrix.os }})
    if:
      github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'full-ci')
      && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-group: release-fast
          next-kind: .next
      - id: format
        name: Check formatting
        run: pnpm format:check
      - id: lint
        name: Check lint rules
        run: pnpm lint
      - id: typecheck
        name: Check types
        run: pnpm typecheck
      - id: unit_tests
        name: Run unit tests
        run: pnpm test
      - id: generated_drift
        name: Check generated OpenAPI and API client drift
        run: bash scripts/ci-generated-drift.sh
      - name: Rehearse rejection of generated artifact drift
        if: runner.os == 'Linux'
        shell: bash
        run: |
          backup="$(mktemp)"
          restore_generated() {
            cp "$backup" apps/api/openapi/openapi.json
            rm -f "$backup"
          }
          cp apps/api/openapi/openapi.json "$backup"
          trap restore_generated EXIT
          printf '\n' >> apps/api/openapi/openapi.json
          if git diff --exit-code -- apps/api/openapi/openapi.json packages/api-client/src/schema.d.ts; then
            echo "The generated artifact drift guard accepted a tracked change"
            exit 1
          fi
          restore_generated
          trap - EXIT
          git diff --exit-code -- apps/api/openapi/openapi.json packages/api-client/src/schema.d.ts
      - id: build
        name: Build production packages
        run: pnpm build
      - name: Write sanitized job summary
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci-job-summary.mjs fast-gates
      - name: Upload job summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fast-gates-summary-${{ runner.os }}-${{ github.run_attempt }}
          path: .local/ci-summary/fast-gates.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
    concurrency:
      group: release-fast-${{ matrix.os }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
  database-gates:
    name: Database integration and coverage
    if:
      github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'full-ci')
      && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://rephone:rephone@localhost:5432/rephone_test
      DIRECT_URL: postgresql://rephone:rephone@localhost:5432/rephone_test
      TEST_DATABASE_URL: postgresql://rephone:rephone@localhost:5432/rephone_test
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: rephone_test
          POSTGRES_USER: rephone
          POSTGRES_PASSWORD: rephone
        ports:
          - 5432:5432
        options:
          --health-cmd "pg_isready -U rephone -d rephone_test" --health-interval 3s --health-timeout
          3s --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
      - name: Verify isolated test database target
        run: |
          node --input-type=module -e "const u = new URL(process.env.TEST_DATABASE_URL); if (u.hostname !== 'localhost' || !u.pathname.endsWith('_test')) throw new Error('CI database target must be a local *_test database')"
      - id: database-safety
        name: Require target validation before any database connection
        run: node scripts/ci-database-safety.mjs
      - id: coverage
        name: Run API release coverage
        run: pnpm test:coverage
      - id: migration-upgrade
        name: Verify migrations preserve existing commerce data
        run: pnpm --filter @rephone/api exec tsx test/migrations/dealer-upgrade.ts
      - name: Upload numeric coverage summary
        if: "!cancelled() && steps.coverage.outcome == 'success'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: database-coverage-${{ github.run_attempt }}
          path: apps/api/coverage/release/coverage-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Write sanitized job summary
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci-job-summary.mjs database-gates
      - name: Upload job summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: database-gates-summary-${{ runner.os }}-${{ github.run_attempt }}
          path: .local/ci-summary/database-gates.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
    concurrency:
      group: release-database-gates-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
  browser-gate:
    name: Browser release suite (Windows)
    if:
      github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'full-ci')
      && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://postgres:root@localhost:5432/rephone_test
      DIRECT_URL: postgresql://postgres:root@localhost:5432/rephone_test
      TEST_DATABASE_URL: postgresql://postgres:root@localhost:5432/rephone_test
      PLAYWRIGHT_WEB_SERVER: production
      PLAYWRIGHT_SHARED_REPORT: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          next-kind: .next-test
      - name: Start isolated PostgreSQL 17 database
        uses: ./.github/actions/windows-postgres
      - name: Verify isolated test database target
        run: |
          node --input-type=module -e "const u = new URL(process.env.TEST_DATABASE_URL); if (u.hostname !== 'localhost' || !u.pathname.endsWith('_test')) throw new Error('CI database target must be a local *_test database')"
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium firefox webkit
      - id: browser
        name: Run deterministic browser suite
        run: pnpm test:browser
      - id: cross-browser
        name: Run Firefox and WebKit critical smoke
        run: pnpm test:browser tests/browser/release-matrix.spec.ts -g skip-links-and-axe --config playwright.cross-browser.config.ts
      - id: verify-release-browser
        name: Verify release-browser report
        if: '!cancelled()'
        env:
          REPORT_OUTCOME: ${{ steps.browser.outcome }}
        run: node scripts/ci-browser-report.mjs .local/playwright-report .local/ci-artifacts/release-browser
      - name: Upload verified release-browser report
        if: "!cancelled() && steps.verify-release-browser.outputs.ready == 'true'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-browser-report-${{ github.run_attempt }}
          path: |
            .local/ci-artifacts/release-browser/report.json
            .local/ci-artifacts/release-browser/index.html
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - id: verify-cross-browser
        name: Verify cross-browser report
        if: '!cancelled()'
        env:
          REPORT_OUTCOME: ${{ steps.cross-browser.outcome }}
        run: node scripts/ci-browser-report.mjs .local/playwright-cross-browser-report .local/ci-artifacts/cross-browser
      - name: Upload verified cross-browser report
        if: "!cancelled() && steps.verify-cross-browser.outputs.ready == 'true'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-browser-report-${{ github.run_attempt }}
          path: |
            .local/ci-artifacts/cross-browser/report.json
            .local/ci-artifacts/cross-browser/index.html
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Write sanitized job summary
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci-job-summary.mjs browser-gate
      - name: Upload job summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-gate-summary-${{ runner.os }}-${{ github.run_attempt }}
          path: .local/ci-summary/browser-gate.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
    concurrency:
      group: release-browser-gate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
  performance-gate:
    name: Production performance gate (Windows)
    if:
      github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'full-ci')
      && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://postgres:root@localhost:5432/rephone_test
      DIRECT_URL: postgresql://postgres:root@localhost:5432/rephone_test
      TEST_DATABASE_URL: postgresql://postgres:root@localhost:5432/rephone_test
      PERFORMANCE_SOURCE_MODE: commit
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          next-kind: .next-performance
      - name: Start isolated PostgreSQL 17 database
        uses: ./.github/actions/windows-postgres
      - name: Verify isolated test database target
        run: |
          node --input-type=module -e "const u = new URL(process.env.TEST_DATABASE_URL); if (u.hostname !== 'localhost' || !u.pathname.endsWith('_test')) throw new Error('CI database target must be a local *_test database')"
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - id: performance
        name: Measure representative production routes
        env:
          PERFORMANCE_REPORT_TYPE: after
          PERFORMANCE_REPORT_PATH: .local/release-performance/performance-ci-after.json
        run: pnpm test:performance tests/performance/release-performance.spec.ts
      - id: verify-performance
        name: Stage allowlisted performance evidence
        if: "!cancelled() && (steps.performance.outcome == 'success' || steps.performance.outcome == 'failure')"
        run:
          node scripts/ci-performance-report.mjs .local/release-performance/performance-ci-after.json .local/performance/client-media.json
          .local/ci-artifacts/performance/report.json
      - name: Upload verified performance evidence
        if: "!cancelled() && steps.verify-performance.outputs.ready == 'true'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-evidence-${{ github.run_attempt }}
          path: .local/ci-artifacts/performance/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Write sanitized job summary
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci-job-summary.mjs performance-gate
      - name: Upload job summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-gate-summary-${{ runner.os }}-${{ github.run_attempt }}
          path: .local/ci-summary/performance-gate.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
    concurrency:
      group: release-performance-gate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
  release-ready:
    name: release-ready
    needs:
      - production-images
      - fast-gates
      - database-gates
      - browser-gate
      - performance-gate
    if:
      always() && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name,
      'full-ci') && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: release-ready-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Require all release suites for this checkout
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-status.mjs release
defaults:
  run:
    shell: bash
