name: Pull request checks
'on':
  pull_request: null
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_OPTIONS: --max-old-space-size=4096
  NODE_ENV: test
  TURBO_TELEMETRY_DISABLED: '1'
  API_PORT: '4001'
  API_PUBLIC_URL: http://localhost:4001
  WEB_PUBLIC_URL: http://localhost:3001
  WEB_ORIGIN: http://localhost:3001
  JWT_ACCESS_SECRET: test-only-jwt-secret-with-at-least-thirty-two-bytes
  IDENTIFIER_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  IDENTIFIER_HMAC_KEY: YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODk=
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: test-placeholder-service-role-key
  SUPABASE_PUBLIC_BUCKET: rephone-public-test
  SUPABASE_PRIVATE_BUCKET: rephone-private-test
  SUPABASE_STORE_BUCKET: rephone-store-assets-test
  SMTP_HOST: localhost
  SMTP_PORT: '1025'
  SMTP_SECURE: 'false'
  SMTP_REQUIRE_TLS: 'false'
  MAIL_FROM: rePhone Test <no-reply@rephone.local>
  LOG_LEVEL: silent
  SCHEDULER_ENABLED: 'false'
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4001/api/v1
  API_INTERNAL_BASE_URL: http://localhost:4001/api/v1
  REPHONE_SKIP_ENV_FILE: 'true'
jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api: ${{ steps.scope.outputs.api }}
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - id: scope
        name: Classify PR changes from merge-base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changes.mjs
  validation:
    name: Format, types, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-group: pr-validation
          next-kind: .next
      - name: Check formatting
        run: pnpm format:check
      - name: Check lint rules
        run: pnpm lint
      - name: Check types
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test
      - name: Check generated OpenAPI and API client drift
        run: bash scripts/ci-generated-drift.sh
      - name: Build production packages
        run: pnpm build
  database:
    name: Database integration and API E2E
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://rephone:rephone@localhost:5432/rephone_test
      DIRECT_URL: postgresql://rephone:rephone@localhost:5432/rephone_test
      TEST_DATABASE_URL: postgresql://rephone:rephone@localhost:5432/rephone_test
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: rephone_test
          POSTGRES_USER: rephone
          POSTGRES_PASSWORD: rephone
        ports:
          - 5432:5432
        options:
          --health-cmd "pg_isready -U rephone -d rephone_test" --health-interval 3s --health-timeout
          3s --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
      - name: Verify isolated test database target
        run: |
          node --input-type=module -e "const u = new URL(process.env.TEST_DATABASE_URL); if (u.hostname !== 'localhost' || !u.pathname.endsWith('_test')) throw new Error('CI database target must be a local *_test database')"
      - name: Run database integration tests
        run: pnpm test:integration
      - name: Run API end-to-end tests
        run: pnpm test:e2e
  browser-smoke:
    name: Chromium critical smoke
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://rephone:rephone@localhost:5432/rephone_test
      DIRECT_URL: postgresql://rephone:rephone@localhost:5432/rephone_test
      TEST_DATABASE_URL: postgresql://rephone:rephone@localhost:5432/rephone_test
      PLAYWRIGHT_WEB_SERVER: production
      PLAYWRIGHT_SHARED_REPORT: 'true'
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: rephone_test
          POSTGRES_USER: rephone
          POSTGRES_PASSWORD: rephone
        ports:
          - 5432:5432
        options:
          --health-cmd "pg_isready -U rephone -d rephone_test" --health-interval 3s --health-timeout
          3s --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
        with:
          next-kind: .next-test
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run critical browser smoke
        run:
          pnpm test:browser tests/browser/release-matrix.spec.ts tests/browser/backoffice-access.spec.ts tests/browser/critical-commerce-flow.spec.ts
          --grep "skip-links-and-axe|anonymous-fail-closed|catalog-to-completed-shipping"
        id: browser
      - id: verify-pr-browser
        name: Verify pr-browser report
        if: '!cancelled()'
        env:
          REPORT_OUTCOME: ${{ steps.browser.outcome }}
        run: node scripts/ci-browser-report.mjs .local/playwright-report .local/ci-artifacts/pr-browser
      - name: Upload verified pr-browser report
        if: "!cancelled() && steps.verify-pr-browser.outputs.ready == 'true'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-browser-report-${{ github.run_attempt }}
          path: |
            .local/ci-artifacts/pr-browser/report.json
            .local/ci-artifacts/pr-browser/index.html
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Write sanitized job summary
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci-job-summary.mjs pr-browser
      - name: Upload job summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-browser-summary-${{ runner.os }}-${{ github.run_attempt }}
          path: .local/ci-summary/pr-browser.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  ci-required:
    name: ci-required
    needs:
      - changes
      - validation
      - database
      - browser-smoke
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Require all affected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-status.mjs pr
defaults:
  run:
    shell: bash
