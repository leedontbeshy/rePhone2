name: Set up rePhone workspace
description: Pinned toolchain, isolated task/compile caches and frozen install
inputs:
  turbo-group:
    description: Unique task-cache writer namespace
    default: ''
  next-kind:
    description: Next.js dist directory whose compile cache is restored
    default: ''
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      with:
        version: 10.18.3
        run_install: false
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Restore Turbo task cache
      if: inputs.turbo-group != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .turbo
        key:
          turbo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package.json', 'pnpm-lock.yaml')
          }}-${{ inputs.turbo-group }}-${{ github.sha }}
        restore-keys: |
          turbo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package.json', 'pnpm-lock.yaml') }}-${{ inputs.turbo-group }}-
    - name: Restore Next.js compile cache
      if: inputs.next-kind != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: apps/web/${{ inputs.next-kind }}/cache
        key:
          next-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package.json', 'pnpm-lock.yaml')
          }}-${{ inputs.next-kind }}-${{ inputs.turbo-group || github.job }}-${{ github.sha }}
        restore-keys: |
          next-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package.json', 'pnpm-lock.yaml') }}-${{ inputs.next-kind }}-${{ inputs.turbo-group || github.job }}-
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
