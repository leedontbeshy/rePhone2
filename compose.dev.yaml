x-api-dev-environment: &api-dev-environment
  NODE_ENV: development
  API_PORT: '4000'
  API_PUBLIC_URL: http://localhost:${GATEWAY_PORT:-3000}
  WEB_PUBLIC_URL: http://localhost:${GATEWAY_PORT:-3000}
  WEB_ORIGIN: http://localhost:${GATEWAY_PORT:-3000}
  DATABASE_URL: ${DATABASE_URL:-}
  DB_POOL_MAX: ${DB_POOL_MAX:-5}
  DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
  DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-10000}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
  JWT_ISSUER: ${JWT_ISSUER:-rephone-api}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-rephone-web}
  AUTH_REFRESH_TTL_DAYS: ${AUTH_REFRESH_TTL_DAYS:-7}
  ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-65536}
  ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
  ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
  PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
  EMPLOYEE_INVITE_TTL_HOURS: ${EMPLOYEE_INVITE_TTL_HOURS:-24}
  GUEST_CART_TTL_DAYS: ${GUEST_CART_TTL_DAYS:-30}
  IDENTIFIER_ENCRYPTION_KEY: ${IDENTIFIER_ENCRYPTION_KEY:-}
  IDENTIFIER_HMAC_KEY: ${IDENTIFIER_HMAC_KEY:-}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
  SUPABASE_PUBLIC_BUCKET: ${SUPABASE_PUBLIC_BUCKET:-rephone-public}
  SUPABASE_PRIVATE_BUCKET: ${SUPABASE_PRIVATE_BUCKET:-rephone-private}
  SUPABASE_STORE_BUCKET: ${SUPABASE_STORE_BUCKET:-rephone-store-assets}
  SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-300}
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  SMTP_SECURE: 'false'
  SMTP_REQUIRE_TLS: 'false'
  SMTP_USER: ''
  SMTP_PASSWORD: ''
  MAIL_FROM: ${MAIL_FROM:-rePhone <no-reply@rephone.local>}
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
  SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-100}
  SCHEDULER_GUEST_CART_BATCH_SIZE: ${SCHEDULER_GUEST_CART_BATCH_SIZE:-200}
  SCHEDULER_AUTH_CLEANUP_BATCH_SIZE: ${SCHEDULER_AUTH_CLEANUP_BATCH_SIZE:-500}
  REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-1mb}
  TRUST_PROXY: 'true'
  APP_VERSION: ${APP_VERSION:-dev}

x-api-dev-build: &api-dev-build
  context: .
  dockerfile: infra/docker/api.Dockerfile

x-service-security: &service-security
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

x-service-logging: &service-logging
  logging:
    options:
      max-size: 10m
      max-file: '3'

services:
  mailpit:
    image: axllent/mailpit:v1.30.6
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    restart: unless-stopped
    networks: [backend, egress]
    <<: *service-logging

  schema-check:
    image: rephone-api-ops:${APP_VERSION:-dev}
    build:
      <<: *api-dev-build
      target: api-operations
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-}
    command: [pnpm, --filter, '@rephone/api', db:check]
    restart: 'no'
    networks: [backend, egress]
    <<: [*service-security, *service-logging]

  migrate:
    image: rephone-api-ops:${APP_VERSION:-dev}
    profiles: [tools]
    build:
      <<: *api-dev-build
      target: api-operations
    environment:
      NODE_ENV: development
      DIRECT_URL: ${DIRECT_URL:-}
    command: [pnpm, --filter, '@rephone/api', db:deploy]
    restart: 'no'
    networks: [backend, egress]
    <<: [*service-security, *service-logging]

  provision-runtime:
    image: rephone-api-ops:${APP_VERSION:-dev}
    profiles: [tools]
    build:
      <<: *api-dev-build
      target: api-operations
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-}
      DIRECT_URL: ${DIRECT_URL:-}
      REPHONE_RUNTIME_DB_PASSWORD: ${REPHONE_RUNTIME_DB_PASSWORD:-}
    command: [pnpm, --filter, '@rephone/api', db:provision-runtime]
    restart: 'no'
    networks: [backend, egress]
    <<: [*service-security, *service-logging]

  api:
    image: rephone-api-dev:${APP_VERSION:-dev}
    build:
      <<: *api-dev-build
      target: api-development
    environment: *api-dev-environment
    depends_on:
      mailpit:
        condition: service_started
      schema-check:
        condition: service_completed_successfully
    expose: ['4000']
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 20s
    networks: [backend, egress]
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /workspace/apps/api
          ignore:
            - dist/
            - node_modules/
            - package.json
            - prisma/schema.prisma
        - action: sync
          path: ./packages
          target: /workspace/packages
          ignore:
            - '**/dist/'
            - '**/node_modules/'
            - '**/package.json'
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./apps/api/prisma/schema.prisma
        - action: rebuild
          path: ./packages/api-client/package.json
        - action: rebuild
          path: ./packages/test-config/package.json
        - action: rebuild
          path: ./packages/typescript-config/package.json
    <<: [*service-security, *service-logging]

  web:
    image: rephone-web-dev:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: web-development
    environment:
      NODE_ENV: development
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      API_INTERNAL_BASE_URL: http://api:4000/api/v1
      NEXT_PUBLIC_STORE_EMAIL: ${NEXT_PUBLIC_STORE_EMAIL:-hello@rephone.vn}
      NEXT_PUBLIC_SOCIAL_FACEBOOK_URL: ${NEXT_PUBLIC_SOCIAL_FACEBOOK_URL:-https://www.facebook.com/rephone.vn}
      NEXT_PUBLIC_SOCIAL_INSTAGRAM_URL: ${NEXT_PUBLIC_SOCIAL_INSTAGRAM_URL:-https://www.instagram.com/rephone.vn}
      NEXT_PUBLIC_SOCIAL_TIKTOK_URL: ${NEXT_PUBLIC_SOCIAL_TIKTOK_URL:-https://www.tiktok.com/@rephone.vn}
    depends_on:
      api:
        condition: service_healthy
    expose: ['3000']
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(r.status!==204)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 20s
    networks: [backend]
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /workspace/apps/web
          ignore:
            - .next/
            - node_modules/
            - package.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./packages/api-client
    <<: [*service-security, *service-logging]

  gateway:
    image: caddy:2.10.2-alpine
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-3000}:80'
    volumes:
      - ./infra/docker/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/__gateway_health]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    networks: [frontend, backend]
    <<: *service-logging
